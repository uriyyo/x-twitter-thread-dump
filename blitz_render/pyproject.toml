[project]
name = "blitz-render"
version = "0.1.0"
description = "Render static HTML to images with Blitz (no browser required)."
requires-python = ">=3.13"

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
module-name = "blitz_render._blitz_render"
features = ["pyo3/extension-module"]
